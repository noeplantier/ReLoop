# Render blueprint: deploys the FastAPI backend from backend/.
# Secrets (SUPABASE_*) are set in the Render dashboard, never in git.
services:
  - type: web
    name: reloop-api
    runtime: python
    rootDir: backend
    region: frankfurt     # closest Render region to Turkey
    plan: free            # sleeps after ~15 min idle; Noé decides on an upgrade for demo day
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
